<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Generala</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="mesa">
        <div id="dice-box"></div>
        <div class="mesa-overlay" id="cargando">Cargando dados…</div>
        <button id="sonido" class="btn-sonido" aria-pressed="false"></button>
      </section>

      <section class="panel">
        <header class="panel-header">
          <div class="titulo">
            <h1>La Generala</h1>
            <span id="modo-actual" class="chip"></span>
          </div>
          <p id="sala-actual" class="sala-actual" hidden></p>
          <p id="turno" class="turno"></p>
          <p id="estado" class="estado"></p>
          <p id="conexion" class="aviso" hidden>Sin conexión. Reconectando…</p>
        </header>

        <div class="controles">
          <div id="dados" class="dados" aria-label="Dados del tiro actual"></div>
          <p id="ayuda" class="ayuda"></p>
          <div id="botones" class="botones"></div>
        </div>

        <div class="planilla-scroll">
          <table class="planilla">
            <thead id="planilla-head"></thead>
            <tbody id="planilla"></tbody>
            <tfoot id="planilla-foot"></tfoot>
          </table>
        </div>

        <div class="pie">
          <button id="fin-accion" class="btn-tirar" hidden></button>
          <button id="salir" class="btn-secundario">Salir</button>
        </div>
      </section>
    </main>

    <!-- Inicio -->
    <section id="inicio" class="pantalla" hidden>
      <div class="tarjeta">
        <h2>La Generala</h2>

        <label class="campo">
          Modo de juego
          <select id="modo"></select>
        </label>
        <p id="modo-desc" class="ayuda"></p>

        <div class="bloque">
          <h3>En esta compu</h3>
          <label class="campo">
            Cantidad de jugadores
            <select id="cantidad">
              <option>1</option>
              <option selected>2</option>
              <option>3</option>
              <option>4</option>
              <option>5</option>
              <option>6</option>
            </select>
          </label>
          <div id="nombres" class="nombres"></div>
          <label class="campo">
            Bots
            <select id="bots"></select>
          </label>
          <button id="jugar-local" class="btn-tirar">Jugar acá</button>
        </div>

        <div class="bloque" id="bloque-online">
          <h3>Online</h3>
          <label class="campo">
            Tu nombre
            <input id="mi-nombre" maxlength="16" autocomplete="nickname" />
          </label>
          <button id="crear-sala" class="btn-tirar">Crear sala</button>
          <div class="unirse">
            <input id="codigo" maxlength="4" placeholder="CÓDIGO" autocapitalize="characters" aria-label="Código de sala" />
            <button id="unirse" class="btn-secundario">Unirme</button>
          </div>
        </div>
        <p id="inicio-error" class="error" role="alert"></p>
      </div>
    </section>

    <!-- Sala de espera -->
    <section id="lobby" class="pantalla" hidden>
      <div class="tarjeta">
        <h2>Sala <span id="lobby-codigo" class="codigo"></span></h2>
        <p class="ayuda">Pasales el código o el link a los demás.</p>
        <button id="compartir" class="btn-secundario">Copiar link</button>

        <label class="campo">
          Modo de juego
          <select id="lobby-modo"></select>
        </label>

        <h3>Jugadores</h3>
        <ul id="lobby-jugadores" class="lista-jugadores"></ul>
        <button id="agregar-bot" class="btn-secundario">🤖 Agregar bot</button>

        <button id="empezar" class="btn-tirar">Empezar</button>
        <p id="lobby-espera" class="ayuda"></p>
        <button id="lobby-salir" class="btn-secundario">Salir de la sala</button>
        <p id="lobby-error" class="error" role="alert"></p>
      </div>
    </section>

    <!-- Chat de la sala (solo online) -->
    <button id="chat-abrir" class="btn-chat" hidden>
      💬 Chat <span id="chat-nuevos" class="badge" hidden></span>
    </button>
    <aside id="chat" class="chat" hidden aria-label="Chat de la sala">
      <header>
        <strong>Chat de la sala</strong>
        <button id="chat-cerrar" class="btn-mini" aria-label="Cerrar chat">✕</button>
      </header>
      <ol id="chat-mensajes" class="chat-mensajes"></ol>
      <form id="chat-form" class="chat-form">
        <input id="chat-texto" maxlength="200" placeholder="Escribí un mensaje…" autocomplete="off" aria-label="Mensaje" />
        <button class="btn-tirar">Enviar</button>
      </form>
    </aside>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
